name: CI

on:
  push:
    branches: [ "main", "remediation/**" ]
  pull_request:
    branches: [ "main", "remediation/**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,evaluator,rl]

    - name: Lint and format check with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Static type check with mypy
      run: |
        mypy agent_praxis

    - name: Run unit & environment test suite
      run: |
        pytest tests/environment tests/adversarial

    - name: Run runner & statistical validation test suite
      run: |
        pytest tests/runner

    - name: Run security & container isolation test suite
      run: |
        pytest tests/security

    - name: Audit evaluator reachability & decoy discrimination
      run: |
        python audit_evaluator_and_reachability.py

    - name: Verify benchmark results provenance
      run: |
        python tools/verify_results_provenance.py results/archive/benchmark_results.json results/archive/benchmark_results_llama3.1_8b.json
        python tools/verify_results_provenance.py --require-harness-hashes results/groq_qwen27b_benchmark.json

    - name: Verify package build & metadata
      run: |
        python -m pip install build twine
        python -m build
        twine check --strict dist/*

