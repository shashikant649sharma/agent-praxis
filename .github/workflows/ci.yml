name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,evaluator,rl]

    - name: Lint and format check with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Static type check with mypy
      run: |
        mypy agent_praxis

    - name: Run unit & environment test suite
      run: |
        pytest tests/environment tests/adversarial

    - name: Run security & container isolation test suite
      run: |
        pytest tests/security

    - name: Audit evaluator reachability & decoy discrimination
      run: |
        python audit_evaluator_and_reachability.py

    - name: Verify benchmark results provenance
      run: |
        python tools/verify_results_provenance.py benchmark_results.json benchmark_results_llama3.1_8b.json

    - name: Verify package build
      run: |
        python -m pip install build
        python -m build
